name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  NEXTEST_COLOR: 1
  CLICOLOR_FORCE: 1
  RUSTUP_MAX_RETRIES: 10
  PACKAGE_NAME: cribo
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Use a shared cache key based on Cargo.lock hash for better cache invalidation
          # Include hash to ensure cache is invalidated when dependencies change
          shared-key: "rust-cache-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}"
          # Cache even on build failures to speed up subsequent runs
          cache-on-failure: true

      - name: 'Install cargo insta'
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-insta
      - name: 'Install cargo nextest'
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-nextest

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          activate-environment: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: 'Run tests'
        shell: bash
        env:
          NEXTEST_PROFILE: 'ci'
        run: cargo insta test --all-features --check --unreferenced reject

      - name: Install Cribo (development)
        # Note: Using build + install instead of develop due to maturin 1.11+ regression with bin bindings
        # https://github.com/PyO3/maturin/issues/2909 (editable installs don't install binaries correctly)
        shell: bash
        run: |
          uv run --with maturin -- maturin build --release --out target/tmp
          uv pip install --force-reinstall target/tmp/*.whl

      - name: Smoke test CLI
        # Use venv python/cribo directly instead of 'uv run' because uv run re-syncs
        # and overwrites the maturin develop installation with a source-only version.
        # The setup-uv action with activate-environment adds venv to PATH.
        shell: bash
        run: |
          # Cross-platform venv paths: Linux/macOS use bin/, Windows uses Scripts/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN=".venv/Scripts"
          else
            VENV_BIN=".venv/bin"
          fi
          "$VENV_BIN/python" -m cribo --help
          "$VENV_BIN/cribo" --version

      - name: E2E bundle test
        env:
          ENTRY_FILE: crates/cribo/tests/fixtures/simple_project/main.py
          OUTPUT_FILE: bundle-test/out.py
        shell: bash
        run: |
          # Cross-platform venv paths (see Smoke test CLI comment)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN=".venv/Scripts"
          else
            VENV_BIN=".venv/bin"
          fi
          mkdir bundle-test
          "$VENV_BIN/python" -m cribo --entry "${{ env.ENTRY_FILE }}" --output "${{ env.OUTPUT_FILE }}"
          "$VENV_BIN/python" "${{ env.OUTPUT_FILE }}"
